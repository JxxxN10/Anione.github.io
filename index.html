<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>문 앞 대시보드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: 피그마 프레임 1024x768 좌표 그대로. 유리판은 피그마에서 내보낸 이미지, 글자·숫자·그래프만 코드로 얹음.
   시계 x109 y214 w327 h167 / 날씨 530,30 / 조명 772,30 / 일과 530,270 / 급식 530,514 / 네트워크 30,514 */
:root {
  --ink: #FFFFFF;
  --ink2: rgba(255,255,255,0.86);
  --ink3: rgba(255,255,255,0.68);
  --shade: 0 1px 3px rgba(0,0,0,0.22);
  --orange: #FF8D28;
  --orange-soft: #FFC48A;
  --yellow: #FFD60A;
  --font: "SD Neo", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, sans-serif;
  --num: "SF Pro", "SF Pro Display", -apple-system, BlinkMacSystemFont, "SD Neo", "Apple SD Gothic Neo", sans-serif;
  --sub: rgba(255,255,255,0.33);
  color-scheme: light;
}
/* 글자 전체 = Apple SD 산돌고딕 Neo (iPad 내장 글꼴을 굵기별로 연결). 큰 숫자(시계·기온·남은 시간)만 SF Pro */
@font-face { font-family: "SD Neo"; font-weight: 400; src: local("AppleSDGothicNeo-Regular"), local("AppleSDGothicNeoR00"); }
@font-face { font-family: "SD Neo"; font-weight: 500; src: local("AppleSDGothicNeo-Medium"), local("AppleSDGothicNeoM00"); }
@font-face { font-family: "SD Neo"; font-weight: 600; src: local("AppleSDGothicNeo-SemiBold"), local("AppleSDGothicNeoSB00"); }
@font-face { font-family: "SD Neo"; font-weight: 700; src: local("AppleSDGothicNeo-Bold"), local("AppleSDGothicNeoB00"); }
html, body { height: 100%; }
body {
  background: #9A9A9E; color: var(--ink); font-family: var(--font);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-touch-callout: none;
}
.viewport { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
.stage { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden;
  background: #9A9A9E url("img/bg.jpg") center / 1024px 768px no-repeat;
  -webkit-transform-origin: 0 0; transform-origin: 0 0; }

.w { position: absolute; box-sizing: border-box; }
.w > img.glass { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.w > .in { position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; color: var(--ink); }
/* 위젯 간격: 가로 21, 세로 18 (피그마 Spacing) */
#wWeather { left: 530px; top: 30px; width: 222px; height: 222px; }
#wLight   { left: 773px; top: 30px; width: 222px; height: 222px; }
#wRoll    { left: 530px; top: 270px; width: 465px; height: 224px; }
#wMeal    { left: 530px; top: 512px; width: 465px; height: 222px; }

/* 시계: 피그마 박스 중심(x 272.5)에 맞춰 가운데 정렬. 글래스는 캔버스로 직접 계산(테두리선·그라데이션 없음) */
.dateline { position: absolute; left: 0; width: 545px; top: 214px; line-height: 26px; text-align: center;
  font-size: 22px; font-weight: 600; letter-spacing: -0.2px; color: rgba(255,255,255,0.75); }  /* 날짜: Medium 22 (잠금화면 정보 줄처럼 시계보다 가볍게) */
/* 시계 캔버스: 위아래 여유를 두고 y194~404. 숫자 윗선 y256(날짜와 20px), 아랫선 y379, 콜론은 피그마 이미지 위치(230.5, 273.5) */
.dateline .grad { opacity: 0.75; display: inline-block; vertical-align: -3px; margin: 0 4px 0 10px; }
.clock { position: absolute; left: 0; width: 545px; top: 194px; height: 210px; }
.clock canvas { display: block; width: 545px; height: 210px;
  -webkit-filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08)); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.08)); }
.clock-text { position: absolute; left: 0; top: 0; width: 545px; text-align: center; font-size: 174px; line-height: 210px; font-weight: 600; font-family: var(--num);
  letter-spacing: 0; font-variant-numeric: tabular-nums; color: rgba(245,245,245,0.6); }
.sample-chip { position: absolute; left: 0; width: 545px; top: 412px; text-align: center; }
.sample-chip span { display: inline-block; padding: 6px 12px; border-radius: 34px; background: rgba(0,0,0,0.2); color: var(--ink2); font-size: 13px; font-weight: 600; }

/* 위젯 공통 글자 */
/* 피그마 타이포: 제목 = Semibold 20 / -0.08px / #FFF, 보조 = Medium 15 / -0.08px / #FFF 33% */
.t-title { font-size: 20px; font-weight: 600; letter-spacing: -0.08px; color: #FFFFFF; }
.t-sub { font-size: 15px; font-weight: 500; letter-spacing: -0.08px; color: var(--sub); }
.head { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 15px; font-weight: 500; color: var(--sub); letter-spacing: -0.08px; }
.head svg { margin-right: 6px; -webkit-flex-shrink: 0; flex-shrink: 0; }
.head .meta { margin-left: auto; }
#wMeal .head { color: rgba(255,255,255,0.75); }   /* 밝은 유리 위에서도 읽히게 */
.big { font-family: var(--num); font-size: 60px; font-weight: 500; line-height: 1; letter-spacing: 0.006em; font-variant-numeric: tabular-nums; }
.mid { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.unit { font-size: 17px; font-weight: 600; letter-spacing: -0.43px; margin-left: 3px; }
.cap { font-size: 15px; font-weight: 500; letter-spacing: -0.08px; color: #FFFFFF; margin-top: 4px; }
.cap-s { font-size: 15px; font-weight: 500; letter-spacing: -0.08px; color: var(--sub); margin-top: 2px; }

/* 날씨: 피그마 위젯 이미지(위치·학교명·"최고"·"최저" 글자 포함) 위에 바뀌는 값만 얹음.
   이미지 실측(1배): 제목 x41 y30, "최고" x20~44.5, "최저" x84.5~109, 두 라벨 아랫선 y199 */
#wWeather .in { padding: 0; }
.wx-temp { letter-spacing: -0.045em; position: absolute; left: 20px; top: 56px; margin-left: -3px; }  /* 숫자 왼쪽 여백만큼 당겨 아래 글자와 시각적으로 왼쪽 정렬 */
.wx-emoji { position: absolute; right: 20px; top: 62px; font-size: 40px; line-height: 1; }
.wx-cond { position: absolute; left: 20px; top: 126px; font-size: 15px; font-weight: 500; letter-spacing: -0.08px; color: #FFFFFF; }
.wx-hl { position: absolute; top: 182px; font-size: 17px; line-height: 20px; font-weight: 500; letter-spacing: -0.43px; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.wx-hi { left: 49px; }
.wx-lo { left: 113px; }

/* 조명: 피그마 이미지 두 장(켜짐/꺼짐)을 바꿔 끼움 + 애플식 꾹 누르기 */
/* 누르기 애니메이션은 CSS 전환이 아니라 JS 스프링(감쇠비·응답시간)으로: 언제든 손을 떼면 현재 크기·속도에서 이어서 복귀 */
#wLight { padding: 0; border: 0; background: none; cursor: pointer; outline: none; border-radius: 34px; will-change: transform; }
#wLight:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,0.9); }
#wLight img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#wLight .off { opacity: 0; }
#wLight.is-off .off { opacity: 1; }
#wLight.is-off .on { opacity: 0; }

/* 다음 일과 */
#wRoll .in { padding: 0 26px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.ring { position: relative; width: 150px; height: 150px; -webkit-flex-shrink: 0; flex-shrink: 0; margin-right: 26px; }
.ring-prog { -webkit-transition: stroke-dashoffset 600ms ease; transition: stroke-dashoffset 600ms ease; }
.ring-mid { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
.roll-label { font-size: 20px; font-weight: 500; letter-spacing: -0.08px; color: #FFFFFF; }
.count { margin: 6px 0 4px; font-family: var(--num); font-size: 56px; font-weight: 500; line-height: 1; letter-spacing: 0.006em; font-variant-numeric: tabular-nums; }
.count .cu { font-size: 22px; font-weight: 600; letter-spacing: -0.26px; }

/* 급식 */
#wMeal .in { padding: 20px 24px; }
/* 급식: 좌우로 끌어 조식·중식·석식 넘기기 (1:1 추적, 속도 전달, 모멘텀 예측, 끝에서 고무줄 저항, 30초 뒤 원래 끼니로 복귀) */
.meal-row { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; margin-top: 6px; }
.meal-title { font-size: 20px; font-weight: 600; letter-spacing: -0.08px; color: #FFFFFF; }
.dots span { display: inline-block; width: 6px; height: 6px; border-radius: 3px; margin-left: 6px; background: rgba(255,255,255,0.33); }
.dots span.on { background: #FFFFFF; }
.meal-view { width: 417px; overflow: hidden; margin-top: 10px; outline: none; cursor: -webkit-grab; cursor: grab; }
.meal-view:focus-visible { box-shadow: 0 0 0 2px rgba(255,255,255,0.8); border-radius: 8px; }
.meal-track { display: -webkit-flex; display: flex; width: 1251px; will-change: transform; }
.meal-track .meal-grid { width: 417px; -webkit-flex-shrink: 0; flex-shrink: 0; margin: 0; box-sizing: border-box; }
.meal-grid { padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; grid-column-gap: 18px; }
.meal-grid li { font-size: 18px; letter-spacing: -0.44px; line-height: 38px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid rgba(255,255,255,0.3); }
.meal-grid li .alg { margin-left: 5px; font-size: 12px; font-weight: 500; letter-spacing: 0; color: rgba(255,255,255,0.7); font-family: var(--num); }
.meal-grid li.fav { color: var(--yellow); font-weight: 700; }

/* 네트워크: 피그마 시안 크기 그대로(카드 없음) — 라벨 + 작은 그래프 */
.net { position: absolute; left: 88px; top: 671px; width: 160px; color: #FFFFFF; }
/* 라벨(한글, 산돌고딕)과 값(영문·숫자, SF Pro)의 글꼴 높이가 달라 가운데 정렬하면 어긋남 → 글자 기준선(baseline)으로 맞춤 */
.net-row { display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; font-size: 15px; line-height: 18px; white-space: nowrap; }
.net-row svg { margin-right: 4px; -webkit-align-self: center; align-self: center; }
.net-row b { font-weight: 700; margin-right: 10px; }
.net-row span { font-weight: 500; }
.spark { display: block; margin-top: 8px; }

/* 귀가 카운트다운: 네트워크와 같은 크기·글꼴. 아래 막대 5칸 = 월~금, 지난 날은 채움, 오늘은 진행률만큼 */
.home { position: absolute; left: 290px; top: 671px; width: 170px; color: #FFFFFF; }
.home .net-row b { margin-right: 10px; }
.days { display: -webkit-flex; display: flex; margin-top: 8px; height: 30px; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-between; justify-content: space-between; }
.day-bars { display: -webkit-flex; display: flex; }
.day-bar { position: relative; -webkit-flex: 1; flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.33); overflow: hidden; }
.day-bar + .day-bar { margin-left: 5px; }
.day-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #FFFFFF; border-radius: 4px; }
.day-labels { display: -webkit-flex; display: flex; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.33); }
.day-labels span { -webkit-flex: 1; flex: 1; text-align: center; }
.day-labels span.today { color: #FFFFFF; }

/* 토스트 */
.toast { position: absolute; left: 272px; top: 440px; -webkit-transform: translate(-50%, 8px); transform: translate(-50%, 8px);
  padding: 12px 18px; border-radius: 34px; white-space: nowrap; background: rgba(28,28,30,0.85); color: #FFFFFF;
  font-size: 15px; font-weight: 600; opacity: 0; pointer-events: none;
  -webkit-transition: opacity 250ms ease, -webkit-transform 250ms ease; transition: opacity 250ms ease, transform 250ms ease; }
.toast.show { opacity: 1; -webkit-transform: translate(-50%, 0); transform: translate(-50%, 0); }

.clock { cursor: pointer; }
/* 야간 모드: StandBy 야간처럼 검은 화면에 어두운 빨간 시계만. 화면 아무 곳이나 누르면 해제 */
.night { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; background: #000; z-index: 50;
  opacity: 0; visibility: hidden; -webkit-transition: opacity 500ms ease, visibility 0s linear 500ms; transition: opacity 500ms ease, visibility 0s linear 500ms; }
.night.on { opacity: 1; visibility: visible; -webkit-transition: opacity 500ms ease; transition: opacity 500ms ease; }
.night-date { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: -0.3px; color: rgba(255,59,48,0.55); }
.night-wake { position: absolute; left: 0; right: 0; top: 512px; text-align: center; font-size: 20px; font-weight: 500; letter-spacing: -0.2px; color: rgba(255,59,48,0.5); }
.night-wake b { font-family: var(--num); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 6px; }
.night-time { position: absolute; left: 0; right: 0; top: 256px; text-align: center; font-family: var(--num); font-size: 236px; line-height: 236px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: rgba(255,59,48,0.7); }

@media (prefers-reduced-motion: reduce) {
  .night { -webkit-transition: none; transition: none; }
  .ring-prog, .toast { -webkit-transition: none; transition: none; }
}
</style>
<style>html,body{margin:0}</style>
</head>
<body>


<div class="viewport" id="viewport">
  <div class="stage" id="stage">

    <div class="dateline" id="date" aria-label="날짜와 졸업까지 남은 날"><span id="dateTxt">16일 (금)</span><img class="grad" src="img/grad.png" width="20" height="18" alt="졸업까지"><span id="gradTxt">123일</span></div>
    <div class="clock" id="clock" role="img" aria-label="9:41">
      <div class="clock-text" id="clockText" aria-hidden="true">9:41</div>
      <canvas id="clockCanvas" width="1090" height="420" aria-hidden="true"></canvas>
    </div>
    <div class="sample-chip" id="sampleChip" hidden><span>예시 데이터</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="night" id="night" role="button" aria-label="야간 모드, 누르면 해제">
      <div class="night-date" id="nightDate"></div>
      <div class="night-time" id="nightTime"></div>
      <div class="night-wake" id="nightWake"></div>
    </div>

    <section class="w" id="wWeather" aria-label="날씨, 애니원고등학교">
      <img class="glass" src="img/w-weather.png" alt="">
      <div class="in">
        <div class="wx-temp big" id="outTemp">14°</div>
        <div class="wx-cond" id="outSky">흐림 · 강수 60%</div>
        <span class="wx-hl wx-hi" id="outHi">18°</span>
        <span class="wx-hl wx-lo" id="outLo">9°</span>
      </div>
    </section>

    <button type="button" class="w" id="wLight" aria-label="방 조명 끄기, 길게 누르기">
      <img class="on" src="img/w-light-on.png" alt="">
      <img class="off" src="img/w-light-off.png" alt="">
    </button>

    <section class="w" id="wRoll" aria-label="다음 일과">
      <img class="glass" src="img/w-roll.png" alt="">
      <div class="in">
        <div class="ring">
          <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
            <circle cx="75" cy="75" r="64" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="16"></circle>
            <circle class="ring-prog" id="ringProg" cx="75" cy="75" r="64" fill="none" stroke="#FF8D28" stroke-width="16" stroke-linecap="round" stroke-dasharray="402.12" stroke-dashoffset="201" transform="rotate(-90 75 75)"></circle>
          </svg>
          <div class="ring-mid" aria-hidden="true"><img src="img/alarm.png" width="34" height="38" alt=""></div>
        </div>
        <div>
          <div class="roll-label" id="nextLabel">야간점호 22:30</div>
          <div class="count" id="count">50:12</div>
          <div class="cap" id="countSub">남음</div>
          <div class="cap-s" id="afterNext" style="margin-top:6px; color: rgba(255,255,255,0.75)">그다음 · 취침 23:30</div>
        </div>
      </div>
    </section>

    <section class="w" id="wMeal" aria-label="급식">
      <img class="glass" src="img/w-meal.png" alt="">
      <div class="in">
        <div class="head"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v20"></path><path d="M4 2v6a3 3 0 0 0 6 0V2"></path><path d="M17 22V2c-2.5 1-4 4-4 8h4"></path></svg><span id="mealWhen">10/16 금 · 07:00</span><span class="meta" id="mealKcal"></span></div>
        <div class="meal-row"><div class="meal-title" id="mealTitle">오늘 조식</div><div class="dots" id="mealDots" aria-hidden="true"><span class="on"></span><span></span><span></span></div></div>
        <div class="meal-view" id="mealView" tabindex="0" aria-label="급식, 좌우로 넘겨 다른 끼니 보기">
          <div class="meal-track" id="mealTrack"><ul class="meal-grid"></ul><ul class="meal-grid"></ul><ul class="meal-grid"></ul></div>
        </div>
      </div>
    </section>

    <div class="net" aria-label="네트워크">
      <div class="net-row">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M4 4a16 16 0 0 1 16 16"></path><path d="M4 11a9 9 0 0 1 9 9"></path><circle cx="5" cy="19" r="1.6" fill="currentColor"></circle></svg>
        <b>네트워크</b><span id="netVal">52</span><span>&nbsp;Mbps</span>
      </div>
      <svg class="spark" width="157" height="30" viewBox="0 0 157 30" aria-hidden="true">
        <defs>
          <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
          </linearGradient>
          <clipPath id="sparkClip"><rect x="0" y="0" width="157" height="30"></rect></clipPath>
        </defs>
        <g clip-path="url(#sparkClip)"><g id="sparkMove">
          <path id="sparkArea" fill="url(#sparkFill)" d=""></path>
          <path id="sparkLine" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" d=""></path>
        </g></g>
        <line x1="1" y1="28.5" x2="156" y2="28.5" stroke="#FFFFFF" stroke-width="1.6" stroke-dasharray="4 3"></line>
      </svg>
    </div>
    <div class="home" aria-label="귀가까지">
      <div class="net-row">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5v-6h4v6h5v-9.5h3z"></path></svg>
        <b id="homeLabel">귀가</b><span id="homeVal">1일 16시간</span>
      </div>
      <div class="days">
        <div class="day-bars" id="dayBars"><div class="day-bar"><i></i></div><div class="day-bar"><i></i></div><div class="day-bar"><i></i></div><div class="day-bar"><i></i></div><div class="day-bar"><i></i></div></div>
        <div class="day-labels" id="dayLabels"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>
      </div>
    </div>
  </div>
</div>

<script>

  var CLK = { weight: 600, sx: 1, size: 312, base: 358, track: 0, colonY: 168, colonW: 47, colonH: 158, colonPad: 22, center: 545 };

  function prepBg(img) {

  function drawGlassClock() {

  /* 시계 · 일과 */
  function hhmm(t) { return pad(Math.floor((t % 1440) / 60)) + ':' + pad(t % 60); }
  function renderClock(d) {

    var hs = CONFIG.hour12 ? ((h % 12) || 12) : pad(h);
    var txt = hs + ':' + pad(d.getMinutes());
    if (txt !== glassText) { glassText = txt; $('clock').setAttribute('aria-label', txt); $('clockText').textContent = txt; drawGlassClock(); }
    var today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var g = CONFIG.gradAt, left = Math.round((new Date(g.y, g.m - 1, g.d) - today) / 86400000);

    $('nightDate').textContent = d.getDate() + '일 (' + DAYS[d.getDay()] + ')';
    $('nightTime').textContent = txt;

    var nowS = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();

    $('nightWake').innerHTML = '기상까지<b>' + Math.floor(leftM / 60) + ':' + pad(leftM % 60) + '</b>';
    $('gradTxt').textContent = left > 0 ? left + '일' : (left === 0 ? '졸업' : '졸업 ' + (-left) + '일째');

      $('count').textContent = '귀가';

    if (i < SCHEDULE.length) { ev = SCHEDULE[i]; prevT = i === 0 ? SCHEDULE[SCHEDULE.length - 1].t - 1440 : SCHEDULE[i - 1].t; }

  /* 귀가 카운트다운 */

  }

    if (hh > 0) return hh + '시간 ' + mm + '분';

  }
  function renderHome(d) {

    var atHome = back < home;   /* 다음 복귀가 다음 귀가보다 먼저 = 지금 집 */
    $('homeLabel').textContent = atHome ? '복귀' : '귀가';
    $('homeVal').textContent = fmtLeft((atHome ? back : home) - d);
    var bars = $('dayBars').getElementsByTagName('i'), labels = $('dayLabels').getElementsByTagName('span');
    var wd = d.getDay(), dayStart = 6 * 60 + 40, dayEnd = CONFIG.homeAt.h * 60 + CONFIG.homeAt.m;

  function sendLight() {
    if (!CONFIG.api || !CONFIG.light) { commitLight(); toast('데모 모드 · 실제 스위치에는 보내지 않았어요'); return; }
    xhr('POST', CONFIG.api + '/command.php', 'cmd=' + (lightOn ? 'light_off' : 'light_on'), function (err) {
      if (err) { springTo(1, 1, 0.3); toast('불을 바꾸지 못했어요 · 서버 연결을 확인해 주세요'); return; }
      commitLight();
      toast(lightOn ? '불을 켰어요' : '불을 껐어요');
    });
  }
  function pointOf(e) { var t = e.touches && e.touches[0] ? e.touches[0] : e; return { x: t.clientX, y: t.clientY }; }
  function holdStart(e) {
    if (e.type === 'touchstart') e.preventDefault();
    if (holdTimer) return;
    var p = pointOf(e); startX = p.x; startY = p.y;
    holdStartAt = Date.now();
    holdTimer = setTimeout(function () { holdTimer = null; sendLight(); }, HOLD_MS);
    springTo(1, 1, 0.3);   /* 목표는 stepSpring이 누른 시간에 맞춰 갱신 */
  }
  function holdCancel(showHint) {
    if (!holdTimer) return;
    clearTimeout(holdTimer); holdTimer = null;
    springTo(1, 1, 0.3);   /* 현재 크기·속도에서 부드럽게 원래대로 */
    if (showHint) toast('길게 누르면 실행돼요');
  }
  function holdMove(e) {
    if (!holdTimer) return;
    var p = pointOf(e);
    if (Math.abs(p.x - startX) > 30 || Math.abs(p.y - startY) > 30) holdCancel(false);
  }
  function bindLight() {
    var b = $('wLight');
    b.addEventListener('touchstart', holdStart, false);
    b.addEventListener('touchmove', holdMove, false);
    b.addEventListener('touchend', function () { holdCancel(true); }, false);
    b.addEventListener('touchcancel', function () { holdCancel(false); }, false);
    b.addEventListener('mousedown', holdStart, false);
    b.addEventListener('mousemove', holdMove, false);
    b.addEventListener('mouseup', function () { holdCancel(true); }, false);
    b.addEventListener('mouseleave', function () { holdCancel(false); }, false);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sendLight(); }
    }, false);
  }

  function tick() { var d = now(); renderClock(d); updateMeal(d); }
  function start() {
    readSim();
    fit();
    initGlass();
    bindLight();
    bindMeal();
    bindNight();
    renderLight();
    tick();
    loadWeather(); measureSpeed();
    setInterval(tick, 1000);
    setInterval(loadWeather, CONFIG.weatherEveryMs);
    setInterval(measureSpeed, CONFIG.speedEveryMs);
    window.addEventListener('resize', refitSoon, false);
    window.addEventListener('orientationchange', refitSoon, false);
    refitSoon(); setInterval(fit, 3000);
    window.addEventListener('hashchange', function () { readSim(); meal.key = ''; tick(); }, false);
    setInterval(function () { var d = now(); if (d.getHours() === 4 && d.getMinutes() === 0 && d.getSeconds() < 2) location.reload(); }, 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, false); else start();
})();
</script>
